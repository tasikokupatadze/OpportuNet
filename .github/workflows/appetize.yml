name: Build Flutter and Upload to Appetize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Restore Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret before building."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" android/app/ci-debug.keystore
          echo "Debug keystore SHA-1 (must be registered in Firebase):"
          keytool -list -v -keystore android/app/ci-debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'

      - name: Install dependencies
        run: flutter pub get

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON repository secret is missing."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation
      - name: Save APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: opportunet-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Check APK fingerprints against Google Sign-In config
        shell: bash
        run: |
          set -euo pipefail
          opportunet_android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$opportunet_android_sdk" ]; then
            echo "::error::Android SDK location is unavailable."
            exit 1
          fi
          opportunet_apksigner="$(find "$opportunet_android_sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$opportunet_apksigner" ]; then
            echo "::error::apksigner was not found in Android SDK Build Tools."
            exit 1
          fi
          "$opportunet_apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | tee apk-certs.txt
          opportunet_sha1="$(grep -m1 'SHA-1 digest' apk-certs.txt | awk '{print $NF}')"
          python3 .github/scripts/check_google_sign_in.py "$opportunet_sha1"

      - name: Upload APK to Appetize.io
        id: appetize
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          platform: 'android'
          appFile: build/app/outputs/flutter-apk/app-debug.apk

      - name: Print Appetize Preview Link
        env:
          APPETIZE_PUBLIC_KEY: ${{ steps.appetize.outputs.publicKey }}
        run: printf 'Live App URL -> https://appetize.io/app/%s\n' "$APPETIZE_PUBLIC_KEY"
